    <path d="M2 24.5 Q 30 16.5 58 24.5 Q 30 19.5 2 24.5 Z" fill="#0f172a"/>
    <path d="M8 25 C16 33, 44 33, 52 25 C42 30.5, 18 30.5, 8 25 Z" fill="#0f172a"/>

    <circle cx="30" cy="24.5" r="7.5" fill="url(#swGreenGradFav)" stroke="#0f172a" stroke-width="1.2"/>
    <circle cx="30" cy="24.5" r="5" fill="#22c55e"/>
    <circle cx="30" cy="24.5" r="3.2" fill="#0f172a"/>

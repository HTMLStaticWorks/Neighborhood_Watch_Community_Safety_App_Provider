    <path d="M29 39.5 C34 43.5, 41 41.5, 47 31 C43 34, 37 35.5, 32 35 C30 35, 29.5 37, 29 39.5 Z" fill="#22c55e"/>
    <path d="M52 27 C50 18, 44 11, 48 6 C46 12, 48 19, 44 25 C47 26, 50 27, 52 27 Z" fill="url(#swAccentGradFav)"/>


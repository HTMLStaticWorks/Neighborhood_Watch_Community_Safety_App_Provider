    <path d="M4 23 C2 12, 10 7, 12 5 C10 11, 12 18, 18 24 C14 26, 7 26, 4 23 Z" fill="url(#swAccentGradFav)"/>
    <path d="M10 26 C7 17, 16 11, 18 9 C15 15, 17 21, 23 27 C18 29, 13 29, 10 26 Z" fill="#22c55e"/>
    

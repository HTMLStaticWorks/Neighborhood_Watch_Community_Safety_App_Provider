    <line x1="16" y1="13.5" x2="22" y2="13.5" stroke="#22c55e" stroke-width="0.8"/>

    <!-- Right House -->
    <rect x="39" y="10" width="2" height="4" fill="#0f172a"/>
    <path d="M33 20 L33 13 L39 9 L45 13 L45 20 Z" fill="#0f172a"/>
    <rect x="36.5" y="12.5" width="5" height="4.5" rx="0.5" fill="white"/>
    <line x1="39" y1="12.5" x2="39" y2="17" stroke="#0f172a" stroke-width="0.7"/>
    <line x1="36.5" y1="14.75" x2="41.5" y2="14.75" stroke="#0f172a" stroke-width="0.7"/>

    <!-- Center House -->
    <rect x="32" y="5" width="2.5" height="5" fill="#1e293b"/>
    <path d="M21 18 L21 9 L30 3 L39 9 L39 18 Z" fill="#0f172a"/>
    <rect x="25" y="8" width="7" height="6" rx="0.5" fill="white"/>
    <line x1="28.5" y1="8" x2="28.5" y2="14" stroke="#0f172a" stroke-width="0.9"/>
    <line x1="25" y1="11" x2="32" y2="11" stroke="#0f172a" stroke-width="0.9"/>


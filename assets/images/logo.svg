<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 50" fill="none" aria-label="SafeWatch">
  <defs>
    <style>
      .shield-stroke { stroke: #0f172a; }
      .check-stroke { stroke: #16a34a; }
      .brand-safe { fill: #0f172a; }
      .brand-watch { fill: #16a34a; }
      .brand-tag { fill: #64748b; }

      @media (prefers-color-scheme: dark) {
        .shield-stroke { stroke: #ffffff; }
        .check-stroke { stroke: #22c55e; }
        .brand-safe { fill: #ffffff; }
        .brand-watch { fill: #22c55e; }
        .brand-tag { fill: #94a3b8; }
      }
    </style>
  </defs>

  <!-- ================= ICON: MINIMALIST SECURITY SHIELD (NO COLOR FILL) ================= -->
  <g transform="translate(4, 2)">
    <!-- Security Shield Outline - Clean, bold, unfilled -->
    <path d="M 20 4 
             C 28 6.8, 34 8, 36 12 
             C 37.5 25, 30.5 35, 20 41 
             C 9.5 35, 2.5 25, 4 12 
             C 6 8, 12 6.8, 20 4 Z" 
          fill="none" 
          class="shield-stroke" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Verified Security Checkmark -->
    <path d="M 12 21.5 L 17.5 27 L 28 15.5" 
          fill="none" 
          class="check-stroke" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- ================= TYPOGRAPHY (ZERO OVERLAP GUARANTEED) ================= -->
  <text x="50" y="30" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.02em">
    <tspan class="brand-safe">Safe</tspan><tspan class="brand-watch">Watch</tspan>
  </text>
  <text x="51" y="41" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="7" font-weight="700" letter-spacing="0.18em" class="brand-tag">COMMUNITY DEFENSE</text>
</svg>

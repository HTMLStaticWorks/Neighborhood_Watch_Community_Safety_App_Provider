<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" fill="none" aria-label="SafeWatch">
  <defs>
    <linearGradient id="swGreenGrad" x1="0" y1="0" x2="60" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="swAccentGrad" x1="0" y1="0" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- ICON GROUP (3 Houses + Watchful Eye + Shield Base) -->
  <g transform="translate(4, 2)">
    <!-- Shield / Leaf Base (Bottom) -->
    <!-- Left green wings/blades -->
    <path d="M4 23 C2 12, 10 7, 12 5 C10 11, 12 18, 18 24 C14 26, 7 26, 4 23 Z" fill="url(#swAccentGrad)"/>
    <path d="M10 26 C7 17, 16 11, 18 9 C15 15, 17 21, 23 27 C18 29, 13 29, 10 26 Z" fill="#22c55e"/>
    
    <!-- Shield bottom contour -->
    <path d="M4 27 C15 45, 33 49, 52 27 C46 38, 30 46, 12 36 C8 33, 5 30, 4 27 Z" fill="#15803d"/>
    <!-- Bottom shield right stripes/field -->
    <path d="M24 37 C31 43, 42 41, 50 28 C45 32, 38 34, 30 33 C27 33, 25 35, 24 37 Z" fill="#16a34a"/>
    <path d="M29 39.5 C34 43.5, 41 41.5, 47 31 C43 34, 37 35.5, 32 35 C30 35, 29.5 37, 29 39.5 Z" fill="#22c55e"/>
    <path d="M52 27 C50 18, 44 11, 48 6 C46 12, 48 19, 44 25 C47 26, 50 27, 52 27 Z" fill="url(#swAccentGrad)"/>

    <!-- 3 HOUSES (Sitting on top of upper eye lid) -->
    <!-- Left House (Bright Green Theme Accent) -->
    <path d="M12 19 L12 12 L19 7 L26 12 L26 19 Z" fill="#22c55e"/>
    <!-- Window 4-pane left house -->
    <rect x="16" y="11" width="6" height="5" rx="0.5" fill="white"/>
    <line x1="19" y1="11" x2="19" y2="16" stroke="#22c55e" stroke-width="0.8"/>
    <line x1="16" y1="13.5" x2="22" y2="13.5" stroke="#22c55e" stroke-width="0.8"/>

    <!-- Right House (Dark Slate / Navy Theme Accent) -->
    <rect x="39" y="10" width="2" height="4" fill="#0f172a"/>
    <path d="M33 20 L33 13 L39 9 L45 13 L45 20 Z" fill="#0f172a"/>
    <!-- Window 4-pane right house -->
    <rect x="36.5" y="12.5" width="5" height="4.5" rx="0.5" fill="white"/>
    <line x1="39" y1="12.5" x2="39" y2="17" stroke="#0f172a" stroke-width="0.7"/>
    <line x1="36.5" y1="14.75" x2="41.5" y2="14.75" stroke="#0f172a" stroke-width="0.7"/>

    <!-- Center House (Tallest Dark Navy House with Chimney) -->
    <rect x="32" y="5" width="2.5" height="5" fill="#1e293b"/>
    <path d="M21 18 L21 9 L30 3 L39 9 L39 18 Z" fill="#0f172a"/>
    <!-- Window 4-pane center house -->
    <rect x="25" y="8" width="7" height="6" rx="0.5" fill="white"/>
    <line x1="28.5" y1="8" x2="28.5" y2="14" stroke="#0f172a" stroke-width="0.9"/>
    <line x1="25" y1="11" x2="32" y2="11" stroke="#0f172a" stroke-width="0.9"/>

    <!-- WATCHFUL EYE (Center) -->
    <!-- Upper Winged Eye Lid Arch -->
    <path d="M0 24 C10 18, 20 16, 30 16 C40 16, 50 18, 60 24 C50 20, 39 18.5, 30 18.5 C21 18.5, 10 20, 0 24 Z" fill="#0f172a"/>
    <path d="M2 24.5 Q 30 16.5 58 24.5 Q 30 19.5 2 24.5 Z" fill="#0f172a"/>

    <!-- Lower Eye Lid Line -->
    <path d="M8 25 C16 33, 44 33, 52 25 C42 30.5, 18 30.5, 8 25 Z" fill="#0f172a"/>

    <!-- Iris (Green Theme Accent Circle) -->
    <circle cx="30" cy="24.5" r="7.5" fill="url(#swGreenGrad)" stroke="#0f172a" stroke-width="1.2"/>
    <circle cx="30" cy="24.5" r="5" fill="#22c55e"/>
    <!-- Pupil (Dark Navy) -->
    <circle cx="30" cy="24.5" r="3.2" fill="#0f172a"/>
    <!-- Catchlight reflection dot -->
    <circle cx="31.8" cy="22.7" r="1.2" fill="white"/>
    <circle cx="28.5" cy="25.8" r="0.6" fill="white" opacity="0.8"/>
  </g>

  <!-- BRAND NAME TEXT -->
  <text x="72" y="30" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="27" font-weight="800" fill="currentColor" letter-spacing="-0.5">Safe</text>
  <text x="128" y="30" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="27" font-weight="800" fill="#16a34a" letter-spacing="-0.5">Watch</text>
  <text x="73" y="44" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="1.2">NEIGHBORHOOD SAFETY</text>
</svg>

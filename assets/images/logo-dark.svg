<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 50" fill="none" aria-label="SafeWatch">
  <!-- ================= ICON: MINIMALIST SECURITY SHIELD (DARK MODE) ================= -->
  <g transform="translate(4, 2)">
    <!-- Security Shield Outline in white, unfilled -->
    <path d="M 20 4 
             C 28 6.8, 34 8, 36 12 
             C 37.5 25, 30.5 35, 20 41 
             C 9.5 35, 2.5 25, 4 12 
             C 6 8, 12 6.8, 20 4 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Verified Security Checkmark in bright emerald -->
    <path d="M 12 21.5 L 17.5 27 L 28 15.5" 
          fill="none" 
          stroke="#22c55e" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- ================= TYPOGRAPHY (DARK MODE) ================= -->
  <text x="50" y="30" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.02em">
    <tspan fill="#ffffff">Safe</tspan><tspan fill="#22c55e">Watch</tspan>
  </text>
  <text x="51" y="41" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="7" font-weight="700" letter-spacing="0.18em" fill="#94a3b8">COMMUNITY DEFENSE</text>
</svg>

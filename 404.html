<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayNexa - Page Not Found</title>
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body class="flex items-center justify-center" style="min-height: 100vh; background: var(--bg-primary);">

  <!-- Drawer Overlay & Menu (Keep simple for 404) -->
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <img src="assets/images/logo.svg" alt="SafeWatch" class="logo-img">
      </a>
      <div class="nav-actions">
        <button class="icon-btn theme-toggle" aria-label="Toggle theme">
          <i class="ph-fill ph-moon theme-icon-dark"></i>
          <i class="ph-fill ph-sun theme-icon-light"></i>
        </button>
      </div>
    </div>
  </header>

  <main style="width: 100%;">
    <section class="text-center" style="padding-top: calc(var(--header-height) + 4rem);">
      <div class="container animate-fade-up">
        <h1 class="text-accent mb-4" style="font-size: 8rem; line-height: 1;">404</h1>
        <h2 class="mb-6">Transaction Declined</h2>
        <p class="lead mb-8 mx-auto" style="max-width: 500px;">We couldn't find the page you're looking for. It might have been moved, deleted, or perhaps the URL is incorrect.</p>
        <a href="index.html" class="btn btn-primary">Return to Homepage</a>
      </div>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
